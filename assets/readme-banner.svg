<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">ytmp3 — Links in. Files out.</title>
  <desc id="desc">A small ferry carries MP3 and video files across a nautical chart to Downloads. One file says, “I used to be a URL.”</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#aa927d" stroke-opacity=".18"/>
    </pattern>
    <pattern id="waves" width="100" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 15Q25 3 50 15T100 15" fill="none" stroke="#3f8580" stroke-opacity=".3" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" rx="12" fill="#e4d8c7"/>
  <rect width="1280" height="440" rx="12" fill="url(#grid)"/>
  <rect x="18" y="18" width="1244" height="404" rx="8" fill="none" stroke="#aa927d"/>
  <path d="M620 18V422" stroke="#aa927d" stroke-dasharray="3 8"/>

  <g font-family="Poppins, Avenir Next, Segoe UI, sans-serif">
    <g fill="#715b4d" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">
      <text x="58" y="65">LOGBOOK FOR DEVS / SMALL TOOLS</text>
      <text x="662" y="65">THE FILE FERRY</text>
    </g>
    <circle cx="1209" cy="59" r="5" fill="#b88a3d"/>
    <text x="54" y="167" fill="#173234" font-size="88" font-weight="800" letter-spacing="-5">ytmp3<tspan fill="#a94b32">.</tspan></text>
    <text x="58" y="222" fill="#261b16" font-size="34" font-weight="600" letter-spacing="-1">Links in. Files out.</text>
    <text x="58" y="262" fill="#715b4d" font-family="Literata, Georgia, serif" font-size="21">Give your favorite tabs a life offline.</text>

    <rect x="58" y="295" width="505" height="56" rx="8" fill="#173234"/>
    <text x="80" y="330" fill="#f4efde" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="19"><tspan fill="#b88a3d">$ </tspan>ytmp3 &quot;URL&quot; --video</text>
    <text x="58" y="386" fill="#715b4d" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" letter-spacing="1">AUDIO + VIDEO  /  DESTINATION: ~/Downloads</text>

    <path d="M675 302C718 276 762 323 807 304S905 279 957 301S1068 329 1130 299S1200 291 1232 305V403H654V324Z" fill="#173234"/>
    <path d="M675 302C718 276 762 323 807 304S905 279 957 301S1068 329 1130 299S1200 291 1232 305" fill="none" stroke="#3f8580" stroke-width="3"/>
    <rect x="662" y="326" width="565" height="65" fill="url(#waves)"/>

    <g transform="translate(735 164) rotate(-8)">
      <path d="M0 0H67L87 20V109H0Z" fill="#eee3d4" stroke="#173234" stroke-width="3" stroke-linejoin="round"/>
      <path d="M67 0V20H87" fill="none" stroke="#173234" stroke-width="2"/>
      <text x="16" y="42" fill="#173234" font-family="IBM Plex Mono, Menlo, monospace" font-size="19" font-weight="700">MP3</text>
      <circle cx="27" cy="63" r="3" fill="#261b16"/>
      <circle cx="55" cy="63" r="3" fill="#261b16"/>
      <path d="M31 76Q41 87 51 76" fill="none" stroke="#261b16" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(861 167) rotate(8)">
      <path d="M0 0H65L85 20V111H0Z" fill="#eee3d4" stroke="#173234" stroke-width="3" stroke-linejoin="round"/>
      <path d="M65 0V20H85" fill="none" stroke="#173234" stroke-width="2"/>
      <rect x="19" y="29" width="47" height="31" rx="5" fill="#173f5f"/>
      <path d="M38 36L51 44L38 52Z" fill="#f4efde"/>
      <path d="M23 78Q28 70 33 78M51 78Q56 70 61 78M35 88Q42 96 49 88" fill="none" stroke="#261b16" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <path d="M784 103H1037Q1047 103 1047 113V141Q1047 151 1037 151H834L814 169L819 151H784Q774 151 774 141V113Q774 103 784 103Z" fill="#eee3d4" stroke="#aa927d" stroke-width="1.5"/>
    <text x="796" y="134" fill="#261b16" font-family="Literata, Georgia, serif" font-size="21" font-style="italic">“I used to be a URL.”</text>

    <path d="M698 255H782L803 274H979L956 313Q951 320 941 320H742Q731 320 725 310Z" fill="#a94b32" stroke="#173234" stroke-width="3" stroke-linejoin="round"/>
    <path d="M715 274H977" stroke="#e4d8c7" stroke-width="3"/>
    <text x="775" y="302" fill="#f4efde" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="2">LOCAL DELIVERY</text>
    <circle cx="746" cy="294" r="7" fill="#b88a3d" stroke="#173234" stroke-width="2"/>
    <circle cx="938" cy="294" r="7" fill="#b88a3d" stroke="#173234" stroke-width="2"/>

    <path d="M1008 271C1065 276 1065 220 1114 221" fill="none" stroke="#3f8580" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M1106 215L1115 221L1106 227" fill="none" stroke="#3f8580" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(1129 183)">
      <path d="M0 0H29L38 10H78V70H0Z" fill="#b88a3d" stroke="#173234" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 23H78V70H0Z" fill="#eee3d4" stroke="#173234" stroke-width="2"/>
      <path d="M39 33V55M30 47L39 56L48 47" fill="none" stroke="#173234" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1132" y="276" fill="#715b4d" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">~/Downloads</text>
    <text x="694" y="378" fill="#f4efde" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="1">LESS BUFFERING. MORE KEEPING.</text>
  </g>
</svg>
